[project]
name = "oss-contribution-finder"
version = "0.2.0"
description = "Find open-source contribution opportunities via GitHub API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yunare Maia", email = "yunare@gmail.com" }]
keywords = ["oss", "contribution", "github", "good-first-issue", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
oss-contribution-finder = "oss_contribution_finder:main"

[project.urls]
Homepage = "https://github.com/yunaremaia/oss-contribution-finder"
Repository = "https://github.com/yunaremaia/oss-contribution-finder"
Issues = "https://github.com/yunaremaia/oss-contribution-finder/issues"
Changelog = "https://github.com/yunaremaia/oss-contribution-finder/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oss_contribution_finder.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
